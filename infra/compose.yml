name: ${COMPOSE_PROJECT_NAME:-sonicrelay}

services:
  api:
    container_name: sonicrelay-api
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-sonicrelay};Username=${POSTGRES_USER:-sonicrelay};Password=${POSTGRES_PASSWORD:-change-me}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:-change-me},abortConnect=false
      Sessions__CodeTtlMinutes: ${SESSION_CODE_TTL_MINUTES:-10}
      Sessions__CodeHmacKey: ${SESSION_CODE_HMAC_KEY:-change-this-session-code-hmac-key}
      Sessions__MaxViewersPerSession: ${SESSION_MAX_VIEWERS:-3}
      DeviceIdentity__CredentialHmacKey: ${DEVICE_IDENTITY_CREDENTIAL_HMAC_KEY:-change-this-device-credential-hmac-key}
      DeviceIdentity__PairingCodeHmacKey: ${DEVICE_IDENTITY_PAIRING_CODE_HMAC_KEY:-change-this-pairing-code-hmac-key}
      DeviceIdentity__TokenSigningKey: ${DEVICE_IDENTITY_TOKEN_SIGNING_KEY:-change-this-device-token-signing-key-32-bytes-minimum}
      # The browser origin the Flutter web viewer is served from. Left empty the API
      # allows its own published viewer; see docs/security.md#browser-origins-cors.
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-}
      # Data retention (issue #44). The defaults already satisfy the "deleted within 90 days"
      # Data Safety declaration; these are here so an operator can see them, not tune them up.
      DataRetention__MaxRetentionDays: ${DATA_RETENTION_MAX_DAYS:-90}
      DataRetention__CleanupIntervalHours: ${DATA_RETENTION_CLEANUP_INTERVAL_HOURS:-24}
      DataRetention__DeviceIdentityRotationDays: ${DATA_RETENTION_DEVICE_ROTATION_DAYS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sonicrelay
    restart: unless-stopped

  postgres:
    container_name: sonicrelay-postgres
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonicrelay}
      POSTGRES_USER: ${POSTGRES_USER:-sonicrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sonicrelay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonicrelay} -d ${POSTGRES_DB:-sonicrelay}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: sonicrelay-redis
    image: redis:${REDIS_VERSION:-7-alpine}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis_data:/data
    networks:
      - sonicrelay
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  coturn:
    container_name: sonicrelay-coturn
    image: coturn/coturn:${COTURN_VERSION:-latest}
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - sonicrelay
    restart: unless-stopped

networks:
  sonicrelay:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
